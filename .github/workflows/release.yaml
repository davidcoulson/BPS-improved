name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release-zip:
    name: Build and attach sextant.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create sextant.zip
        run: |
          cd custom_components/sextant
          zip -r "${{ github.workspace }}/sextant.zip" . -x '*/__pycache__/*' '__pycache__/*'

      - name: Upload sextant.zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: sextant.zip
