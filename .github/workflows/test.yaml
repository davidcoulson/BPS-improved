name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.9 runs on Python 3.14.
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Byte-compile the integration
        run: python -m py_compile custom_components/sextant/*.py
      - name: Run unit tests
        run: pytest tests/ -q

  javascript:
    name: Frontend syntax + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check the frontend
        run: |
          for f in custom_components/sextant/frontend/sextant-*.js; do node --check "$f"; done
      - name: Frontend unit tests
        run: node --test tests/frontend/
